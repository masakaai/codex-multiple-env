name: Feature request
description: Propose a bounded profile-management improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What account or workspace workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Identity boundary
      options:
        - label: This request does not require changing the identity of an already-running Codex conversation.
          required: true
